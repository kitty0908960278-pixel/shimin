<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomodoro - 專注守護者</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        
        <!-- ================= 左側：共用導覽列 ================= -->
        <aside class="sidebar">
            <div class="logo-box"></div>
            
            <nav class="nav-menu">
                <a href="#" class="nav-item active" onclick="switchPage('page-timer', event)">
                    <i class="fa-solid fa-clock"></i>
                    <span>專注計時</span>
                </a>
                <a href="#" class="nav-item" onclick="switchPage('page-todo', event)">
                    <i class="fa-solid fa-list-check"></i>
                    <span>待辦清單</span>
                </a>
                <a href="#" class="nav-item" onclick="switchPage('page-shop', event)">
                    <i class="fa-solid fa-store"></i>
                    <span>換裝商店</span>
                </a>
                <a href="#" class="nav-item" onclick="switchPage('page-achievements', event)">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>我的成就</span>
                </a>
            </nav>

            <div class="coin-display">
                <i class="fa-solid fa-coins icon-coin"></i>
                <span class="coin-label">我的金幣</span>
                <span class="coin-value">120</span>
            </div>
        </aside>

        <!-- ================= 右側：主要內容切換區 ================= -->
        <main class="main-content">

                    </svg>
                </div>

                <!-- 顯示目前鎖定要專注的科目 -->
                <div id="current-task-banner" style="color: var(--text-muted); font-size: 16px; font-weight: 700; margin-top: 10px; background: var(--card-bg-alt); padding: 6px 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);">
                    目前專注任務：<span id="active-task-name" style="color: var(--primary);">尚未選擇任務 (點擊待辦清單設定)</span>
                </div>

                <div id="timer-display" class="timer-display">25:00</div>
                
                <div class="control-buttons">
                    <button id="start-btn" class="btn btn-primary">開始</button>
                    <button id="reset-btn" class="btn btn-secondary">跳過/重置</button>
                    <button id="stop-alarm-btn" class="btn btn-secondary">關閉鈴聲</button>
                </div>
                
                <div class="settings-panel">
                    <div class="settings-header">
                        <h3 class="settings-title">計時設定</h3>
                        <button class="btn-apply">套用設定</button>
                    </div>
                    <div class="settings-cards">
                        <div class="setting-card">
                            <div class="setting-label">專注 ( 分 )</div>
                            <div class="setting-controls">
                                <button class="circle-btn"><i class="fa-solid fa-minus"></i></button>
                                <span class="setting-value">25</span>
                                <button class="circle-btn"><i class="fa-solid fa-plus"></i></button>
                            </div>
                        </div>
                        <div class="setting-card">
                            <div class="setting-label">休息 ( 分 )</div>
                            <div class="setting-controls">
                                <button class="circle-btn"><i class="fa-solid fa-minus"></i></button>
                                <span class="setting-value">5</span>
                                <button class="circle-btn"><i class="fa-solid fa-plus"></i></button>
                            </div>
                        </div>
                        <div class="setting-card">
                            <div class="setting-label">番茄數</div>
                            <div class="setting-controls">
                                <button class="circle-btn"><i class="fa-solid fa-minus"></i></button>
                                <span class="setting-value">4</span>
                                <button class="circle-btn"><i class="fa-solid fa-plus"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 頁面 2：待辦清單 -->
            <div id="page-todo" class="page-section">
                <div class="todo-wrapper">
                    <h2 class="section-title">待辦清單</h2>
                    <div class="todo-input-row">
                        <input type="text" id="task-input" class="todo-input" placeholder="輸入要專心做的事 (例如: 經濟學)...">
                        <button id="add-task-btn" class="btn-add"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <ul id="task-list" class="todo-list">
                        <!-- 動態生成任務列表 -->
                    </ul>
                </div>
            </div>

            <!-- 頁面 3：換裝商店 -->
            <div id="page-shop" class="page-section">
                <div class="character-panel">
                    <h2 class="section-title">我的角色</h2>
                    <div class="character-preview-box">
                        <svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1000 1000" width="100%" height="100%">
                          <defs>
                            <style>
                              .st0 { fill: #f6836f; }
                              .st1 { fill: #c69c6d; }
                              .st2 { fill: #abdbe3; }
                              .st3 { fill: #ffddab; }
                              .st4 { fill: #ffe7db; }
                              .st5 { fill: #754c24; }
                              .st6 { fill: #E76F51; }
                            </style>
                          </defs>
                          <g id="backhair"><ellipse class="st1" cx="494.92" cy="418.12" rx="290.88" ry="308.16"/></g>

                          </g>

                          </g>

                            <ellipse class="st5" cx="609.39" cy="440.2" rx="31.25" ry="45.63"/>
                          </g>

                          </g>

                    </div>
                    <button class="btn btn-primary btn-save">儲存</button>
                </div>
                <div class="shop-panel">
                    <div class="shop-header">
                        <h2 class="section-title">換裝商店</h2>
                        <div class="filter-toggle">
                            <button class="filter-btn active">全部</button>
                            <button class="filter-btn">髮型</button>
                            <button class="filter-btn">服飾</button>
                        </div>
                    </div>
                   <div class="shop-grid">
                        <!-- 商品 1：藍色連身裙（帶有衣服圖示與名稱） -->
                        <div class="shop-item" onclick="changeOutfit('dresstest')" style="display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; padding: 10px;">
                            <svg viewBox="200 500 600 400" width="70" height="70">
                                <path fill="#abdbe3" d="M215.56,546.76v121.92c40.32,26.88,80.64,53.76,120.96,80.64l-60.48,120.96c37.21,20.37,108.8,53.1,204.48,57.6,111.19,5.23,195.48-30.47,234.24-49.92-17.92-40.96-35.84-81.92-53.76-122.88,37.37-25.6,74.75-51.2,112.12-76.8v-117.12c-91.13,14.08-182.27,28.16-273.4,42.24"/>

                        </div>
                        <!-- 商品 2：橘色洋裝（帶有衣服圖示與名稱） -->

                            </svg>
                            <span style="font-size: 14px; color: var(--primary); font-weight: bold; margin-top: 4px;">橘色洋裝</span>
                        </div>
                        <div class="shop-item"></div>
                        <div class="shop-item"></div>
                    </div>
                </div>
            </div>

            <!-- 頁面 4：我的成就 -->
            <div id="page-achievements" class="page-section">
                <div class="achievements-wrapper">
                    <h2 class="section-title">我的成就</h2>
                    <div class="achievements-top-row">
                        <div class="achievement-card">
                            <div class="level-header">
                                <div class="level-icon"><i class="fa-solid fa-cat"></i></div>
                                <div class="level-info">
                                    <div class="level-title-row">
                                        <span class="level-title">Lv. 12</span>
                                        <span class="level-tag">專注達人</span>
                                    </div>
                                    <span class="level-subtitle">已累計專注 48 小時</span>
                                </div>
                            </div>
                            <div class="progress-container">
                                <div class="progress-track"><div class="progress-fill" style="width: 85%;"></div></div>
                                <span class="progress-text">850 / 1000 EXP</span>
                            </div>
                        </div>
                        <div class="achievement-card">
                            <div class="collection-header">
                                <span class="collection-title">配件收集度</span>
                                <span class="collection-count">5<span class="collection-total">/15</span></span>
                            </div>
                            <div class="progress-container">
                                <div class="progress-track"><div class="progress-fill" style="width: 33%;"><span class="progress-percent">33%</span></div></div>
                            </div>
                            <div class="collection-icons">
                                <div class="collection-icon locked"><i class="fa-solid fa-glasses"></i></div>
                                <div class="collection-icon locked"><i class="fa-solid fa-hat-wizard"></i></div>
                                <div class="collection-icon active"><i class="fa-solid fa-shirt"></i></div>
                            </div>
                        </div>
                    </div>
                    <div class="achievement-card badges-card">
                        <h3 class="badges-title">成就徽章</h3>
                        <div class="badges-grid">
                            <div class="badge-item"><div class="badge-icon unlocked"><i class="fa-solid fa-seedling"></i></div><span class="badge-name">第一顆番茄</span></div>
                            <div class="badge-item"><div class="badge-icon unlocked"><i class="fa-solid fa-fire"></i></div><span class="badge-name">連續7天</span></div>
                            <div class="badge-item"><div class="badge-item unlocked"><i class="fa-solid fa-bag-shopping"></i></div><span class="badge-name">購物狂</span></div>
                            <div class="badge-item locked-badge"><div class="badge-icon"><i class="fa-solid fa-moon"></i></div><span class="badge-name">夜貓子</span></div>
                            <div class="badge-item locked-badge"><div class="badge-icon"><i class="fa-solid fa-gem"></i></div><span class="badge-name">全圖鑑收集</span></div>
                            <div class="badge-item locked-badge"><div class="badge-icon"><i class="fa-solid fa-trophy"></i></div><span class="badge-name">專注100時</span></div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        function switchPage(pageId, event) {
            event.preventDefault();
            document.querySelectorAll('.page-section').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
    <script src="tomoto.js"></script>
    <audio id="alarm-audio" src="alarm.mp3" preload="auto"></audio>
</body>
</html>
